{% extends 'base.html' %}


{% block title %}
    Edit Comment - NewsBlog
{% endblock %}


{% block content %}

<style>

    .edit-container {

        max-width: 700px;

        margin: 60px auto;

        padding: 0 20px;

    }


    .edit-card {

        background: white;

        padding: 35px;

        border-radius: 12px;

        border: 1px solid #e1e5ea;

        box-shadow:
            0 5px 20px rgba(0,0,0,0.08);

    }


    .edit-card h1 {

        margin-top: 0;

        margin-bottom: 10px;

    }


    .subtitle {

        color: #777;

        margin-bottom: 25px;

    }


    textarea {

        width: 100%;

        padding: 12px;

        border: 1px solid #ccc;

        border-radius: 7px;

        font-size: 16px;

        resize: vertical;

        min-height: 120px;

    }


    textarea:focus {

        outline: none;

        border-color: #007bff;

        box-shadow:
            0 0 0 2px rgba(0,123,255,0.1);

    }


    .buttons {

        display: flex;

        align-items: center;

        gap: 12px;

        margin-top: 20px;

    }


    .update-btn {

        padding: 10px 18px;

        border: none;

        background: #007bff;

        color: white;

        border-radius: 6px;

        cursor: pointer;

        font-weight: bold;

    }


    .update-btn:hover {

        background: #0056b3;

    }


    .cancel-btn {

        padding: 10px 18px;

        background: #f1f3f5;

        color: #333;

        text-decoration: none;

        border-radius: 6px;

    }


    .cancel-btn:hover {

        background: #e2e6ea;

    }


    @media (max-width: 650px) {

        .edit-card {

            padding: 22px;

        }


        .buttons {

            flex-direction: column;

            align-items: stretch;

        }


        .update-btn,
        .cancel-btn {

            text-align: center;

        }

    }

</style>


<div class="edit-container">


    <div class="edit-card">


        <h1>
            Edit Comment
        </h1>


        <p class="subtitle">

            Update your comment below.

        </p>


        <form method="POST">

            {% csrf_token %}


            {{ form.as_p }}


            <div class="buttons">


                <button
                    type="submit"
                    class="update-btn"
                >

                    Update Comment

                </button>


                <a
                    href="{% url 'article_detail' comment.article.slug %}"
                    class="cancel-btn"
                >

                    Cancel

                </a>


            </div>


        </form>


    </div>

</div>

{% endblock %}
